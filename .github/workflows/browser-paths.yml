name: browser-paths

on:
  push:
    paths:
      - .github/workflows/browser-paths.yml
  workflow_dispatch:

env:
  CLI_VERSION: v2.15.6

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch CLI and path list
        run: |
          curl -sSLo single-file "https://github.com/gildas-lormeau/single-file-cli/releases/download/$CLI_VERSION/single-file-x86_64-linux"
          chmod +x single-file
          curl -sSLo constants.js "https://raw.githubusercontent.com/gildas-lormeau/single-file-cli/$CLI_VERSION/lib/constants.js"
          grep -oE '"/[^"]+"' constants.js | tr -d '"' | grep -v '^/Applications' | sort -u > listed.txt
          wc -l listed.txt
      - name: Baseline (runner browsers as shipped)
        timeout-minutes: 5
        run: |
          set +e
          run_cli() { name=$1; shift; rm -f out.html; ./single-file https://example.com out.html "$@" > log.txt 2>&1; code=$?; echo "RESULT [$name] exit=$code size=$(stat -c %s out.html 2>/dev/null || echo none) log=$(head -c 300 log.txt | tr '\n' ' ')"; }
          run_cli chromium-default
          run_cli firefox-default --browser-engine firefox
          true
      - name: Install snap chromium and flatpak firefox
        timeout-minutes: 15
        run: |
          set +e
          sudo snap install chromium; echo "snap exit=$?"
          sudo apt-get update -qq && sudo apt-get install -y -qq flatpak; echo "apt flatpak exit=$?"
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive --system flathub org.mozilla.firefox > flatpak.log 2>&1; echo "flatpak exit=$?"; tail -3 flatpak.log
          true
      - name: Step 1 - where they landed
        run: |
          set +e
          for p in /snap/bin/chromium /var/lib/flatpak/exports/bin/org.mozilla.firefox; do echo "LOCATION $p: $(ls -l "$p" 2>&1)"; done
          echo "which -a: $(which -a chromium chromium-browser firefox google-chrome 2>&1 | tr '\n' ' ')"
          true
      - name: Hide every listed path
        run: |
          while read -r p; do if [ -e "$p" ] || [ -L "$p" ]; then echo "HIDING $p -> $(readlink -f "$p")"; sudo mv "$p" "$p.hidden"; fi; done < listed.txt
      - name: Step 2 - CLI with only snap/flatpak installs
        timeout-minutes: 6
        run: |
          set +e
          run_cli() { name=$1; shift; rm -f out.html; ./single-file https://example.com out.html "$@" > log.txt 2>&1; code=$?; echo "RESULT [$name] exit=$code size=$(stat -c %s out.html 2>/dev/null || echo none) log=$(head -c 300 log.txt | tr '\n' ' ')"; }
          run_cli chromium-default
          run_cli chromium-snap-explicit --browser-executable-path /snap/bin/chromium
          run_cli firefox-default --browser-engine firefox
          run_cli firefox-flatpak-explicit --browser-engine firefox --browser-executable-path /var/lib/flatpak/exports/bin/org.mozilla.firefox
          true

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch CLI and path list
        run: |
          Invoke-WebRequest "https://github.com/gildas-lormeau/single-file-cli/releases/download/$env:CLI_VERSION/single-file.exe" -OutFile single-file.exe
          Invoke-WebRequest "https://raw.githubusercontent.com/gildas-lormeau/single-file-cli/$env:CLI_VERSION/lib/constants.js" -OutFile constants.js
          $listed = [regex]::Matches((Get-Content constants.js -Raw), '"(C:\\\\[^"]+)"') | ForEach-Object { $_.Groups[1].Value -replace '\\\\', '\' } | Sort-Object -Unique
          $listed | Set-Content listed.txt
          "listed: $($listed.Count)"
      - name: Baseline (runner browsers as shipped)
        timeout-minutes: 5
        run: |
          function Run-Cli($name, [string[]]$extra) { Remove-Item out.html -ErrorAction SilentlyContinue; & .\single-file.exe https://example.com out.html @extra *> log.txt; $code = $LASTEXITCODE; $size = if (Test-Path out.html) { (Get-Item out.html).Length } else { "none" }; $log = (Get-Content log.txt -Raw) -replace "`r?`n", " "; if ($log.Length -gt 300) { $log = $log.Substring(0, 300) }; "RESULT [$name] exit=$code size=$size log=$log" }
          Run-Cli chromium-default @()
          Run-Cli firefox-default @("--browser-engine", "firefox")
          exit 0
      - name: Per-user installs with winget
        timeout-minutes: 18
        run: |
          "winget: $((Get-Command winget -ErrorAction SilentlyContinue).Source)"
          foreach ($id in 'Google.Chrome.Canary', 'Google.Chrome', 'Opera.Opera', 'Vivaldi.Vivaldi', 'Yandex.Browser', 'Brave.Brave', 'Mozilla.Firefox') {
            $out = winget install --id $id --exact --scope user --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 3
            "WINGET $id exit=$LASTEXITCODE :: $($out -join ' | ')"
          }
          exit 0
      - name: Step 1 - where they landed
        run: |
          $names = 'chrome.exe', 'msedge.exe', 'brave.exe', 'vivaldi.exe', 'opera.exe', 'launcher.exe', 'browser.exe', 'firefox.exe'
          foreach ($root in $env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)}) {
            Get-ChildItem $root -Recurse -Depth 5 -Include $names -ErrorAction SilentlyContinue | ForEach-Object { "LOCATION $($_.FullName)" }
          }
          exit 0
      - name: Hide every listed path
        run: |
          foreach ($p in Get-Content listed.txt) { if (Test-Path $p) { try { Move-Item $p "$p.hidden" -Force -ErrorAction Stop; "HIDING $p" } catch { "HIDE FAILED $p :: $_" } } }
          exit 0
      - name: Step 2 - CLI with only per-user installs
        timeout-minutes: 8
        run: |
          function Run-Cli($name, [string[]]$extra) { Remove-Item out.html -ErrorAction SilentlyContinue; & .\single-file.exe https://example.com out.html @extra *> log.txt; $code = $LASTEXITCODE; $size = if (Test-Path out.html) { (Get-Item out.html).Length } else { "none" }; $log = (Get-Content log.txt -Raw) -replace "`r?`n", " "; if ($log.Length -gt 300) { $log = $log.Substring(0, 300) }; "RESULT [$name] exit=$code size=$size log=$log" }
          Run-Cli chromium-default @()
          Run-Cli firefox-default @("--browser-engine", "firefox")
          $found = Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 5 -Include 'chrome.exe', 'brave.exe', 'vivaldi.exe', 'launcher.exe', 'browser.exe' -ErrorAction SilentlyContinue
          foreach ($f in $found) { Run-Cli "chromium-explicit $($f.FullName)" @("--browser-executable-path", $f.FullName) }
          $ff = Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 3 -Include 'firefox.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ff) { Run-Cli "firefox-explicit $($ff.FullName)" @("--browser-engine", "firefox", "--browser-executable-path", $ff.FullName) }
          exit 0

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Fetch CLI and path list
        run: |
          curl -sSLo single-file "https://github.com/gildas-lormeau/single-file-cli/releases/download/$CLI_VERSION/single-file-aarch64-apple-darwin"
          chmod +x single-file
          curl -sSLo constants.js "https://raw.githubusercontent.com/gildas-lormeau/single-file-cli/$CLI_VERSION/lib/constants.js"
          grep -oE '"/Applications/[^"]+\.app/' constants.js | sed 's/^"//; s/\/$//' | sort -u > apps.txt
          cat apps.txt
      - name: Baseline (runner browsers as shipped)
        timeout-minutes: 5
        run: |
          set +e
          run_cli() { name=$1; shift; rm -f out.html; ./single-file https://example.com out.html "$@" > log.txt 2>&1; code=$?; echo "RESULT [$name] exit=$code size=$(stat -f %z out.html 2>/dev/null || echo none) log=$(head -c 300 log.txt | tr '\n' ' ')"; }
          run_cli chromium-default
          run_cli firefox-default --browser-engine firefox
          true
      - name: Move every listed app to ~/Applications
        run: |
          mkdir -p ~/Applications
          while read -r a; do if [ -d "$a" ]; then echo "MOVING $a"; sudo mv "$a" ~/Applications/; fi; done < apps.txt
          ls ~/Applications
      - name: Step 2 - CLI with apps in ~/Applications
        timeout-minutes: 6
        run: |
          set +e
          run_cli() { name=$1; shift; rm -f out.html; ./single-file https://example.com out.html "$@" > log.txt 2>&1; code=$?; echo "RESULT [$name] exit=$code size=$(stat -f %z out.html 2>/dev/null || echo none) log=$(head -c 300 log.txt | tr '\n' ' ')"; }
          run_cli chromium-default
          run_cli firefox-default --browser-engine firefox
          [ -d ~/Applications/"Google Chrome.app" ] && run_cli chrome-explicit --browser-executable-path ~/Applications/"Google Chrome.app/Contents/MacOS/Google Chrome"
          [ -d ~/Applications/Firefox.app ] && run_cli firefox-explicit --browser-engine firefox --browser-executable-path ~/Applications/Firefox.app/Contents/MacOS/firefox
          true
