name: browser-hunches

on:
  push:
    paths:
      - .github/workflows/browser-hunches.yml
  workflow_dispatch:

env:
  CLI_SHA: 000e1d540def423227c68909981c7105c29c0e4d

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: CLI
        run: |
          git clone -q https://github.com/gildas-lormeau/single-file-cli.git cli
          git -C cli checkout -q $env:CLI_SHA
          git -C cli log --oneline -1
          deno cache cli\single-file *> $null; "cache exit=$LASTEXITCODE"
          "https://example.com`nhttps://example.org`nhttps://example.net" | Set-Content urls.txt
          @'
          function Cap($name, [string[]]$cliArgs, $limit = 150) {
            "===== $name"
            Remove-Item out.html, log.txt -ErrorAction SilentlyContinue
            Remove-Item multi -Recurse -Force -ErrorAction SilentlyContinue
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $job = Start-Job -ScriptBlock { param($dir, $a) Set-Location $dir; & deno run -A cli\single-file @a *> log.txt; $LASTEXITCODE } -ArgumentList (Get-Location).Path, $cliArgs
            $done = [bool](Wait-Job $job -Timeout $limit)
            $code = if ($done) { Receive-Job $job } else { Stop-Job $job; "TIMEOUT" }
            $size = if (Test-Path out.html) { (Get-Item out.html).Length } else { "none" }
            $multi = if (Test-Path multi) { @(Get-ChildItem multi -File).Count } else { "none" }
            $retries = if (Test-Path log.txt) { @(Select-String -Path log.txt -Pattern "retrying without it").Count } else { 0 }
            "EXIT=$code secs=$([math]::Round($sw.Elapsed.TotalSeconds, 1)) size=$size multi=$multi relaunch_warnings=$retries"
            if (Test-Path log.txt) { Get-Content log.txt | Select-Object -Last 12 }
            Get-Process firefox, brave, vivaldi, chrome -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
          }
          '@ | Set-Content cap.ps1
      - name: Chrome baseline (default single-process)
        run: |
          . .\cap.ps1
          Cap "chrome default 1" @("https://example.com", "out.html")
          Cap "chrome default 2" @("https://example.com", "out.html")
          Cap "chrome no-single-process" @("https://example.com", "out.html", "--browser-single-process", "false")
          exit 0
      - name: Install MSIX Firefox (per user)
        timeout-minutes: 10
        run: |
          $out = winget install --id Mozilla.Firefox --exact --scope user --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 2
          "WINGET exit=$LASTEXITCODE :: $out"
          Get-AppxPackage -Name *Firefox* | Format-List Name, Version, InstallLocation, PackageFamilyName
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WindowsApps" -Filter *firefox* -Recurse -ErrorAction SilentlyContinue | ForEach-Object { "alias: $($_.FullName) len=$($_.Length) attrs=$($_.Attributes)" }
          Test-Path "$env:LOCALAPPDATA\Mozilla Firefox\firefox.exe"
          exit 0
      - name: M - MSIX Firefox
        run: |
          . .\cap.ps1
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\firefox.exe"
          "---- control: machine-wide Firefox"
          Cap "firefox machine-wide" @("https://example.com", "out.html", "--browser-engine", "firefox")
          $before = Get-Date
          Cap "msix explicit alias" @("https://example.com", "out.html", "--browser-engine", "firefox", "--browser-executable-path", $alias)
          "---- WebDriverBiDiServer.json / user.js written since the run, anywhere under LOCALAPPDATA"
          Get-ChildItem $env:LOCALAPPDATA -Recurse -Force -ErrorAction SilentlyContinue -Include WebDriverBiDiServer.json, user.js | Where-Object { $_.LastWriteTime -gt $before } | ForEach-Object { "  $($_.FullName)" }
          $pkg = Get-AppxPackage -Name *Firefox* | Select-Object -First 1
          if ($pkg) {
            $exe = Join-Path $pkg.InstallLocation "VFS\ProgramFiles\Mozilla Firefox\firefox.exe"
            if (-not (Test-Path $exe)) { $exe = (Get-ChildItem $pkg.InstallLocation -Recurse -Filter firefox.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
            "package exe: $exe"
            Cap "msix explicit package exe" @("https://example.com", "out.html", "--browser-engine", "firefox", "--browser-executable-path", $exe)
          }
          "---- default lookup with the machine-wide Firefox hidden"
          Rename-Item "C:\Program Files\Mozilla Firefox" "Mozilla Firefox.hidden" -ErrorAction Continue
          Cap "msix default lookup" @("https://example.com", "out.html", "--browser-engine", "firefox")
          Rename-Item "C:\Program Files\Mozilla Firefox.hidden" "Mozilla Firefox" -ErrorAction Continue
          exit 0
      - name: Install Brave and Vivaldi (per user)
        timeout-minutes: 12
        run: |
          foreach ($id in "Brave.Brave", "Vivaldi.Vivaldi") {
            $out = winget install --id $id --exact --scope user --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 1
            "WINGET $id exit=$LASTEXITCODE :: $out"
          }
          Get-Process brave, vivaldi -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0
      - name: S - single-process cost
        run: |
          . .\cap.ps1
          $browsers = @{ brave = "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\Application\brave.exe"; vivaldi = "$env:LOCALAPPDATA\Vivaldi\Application\vivaldi.exe" }
          foreach ($b in "brave", "vivaldi") {
            $p = $browsers[$b]
            "#### $b exists=$(Test-Path $p)"
            foreach ($i in 1..3) {
              Cap "$b default $i" @("https://example.com", "out.html", "--browser-executable-path", $p)
              Cap "$b no-single-process $i" @("https://example.com", "out.html", "--browser-executable-path", $p, "--browser-single-process", "false")
            }
            Cap "$b default 3 urls" @("--urls-file", "urls.txt", "--output-directory", "multi", "--browser-executable-path", $p)
            Cap "$b no-single-process 3 urls" @("--urls-file", "urls.txt", "--output-directory", "multi", "--browser-executable-path", $p, "--browser-single-process", "false")
          }
          exit 0

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: CLI
        run: |
          git clone -q https://github.com/gildas-lormeau/single-file-cli.git cli
          git -C cli checkout -q $CLI_SHA
          git -C cli log --oneline -1
          deno cache cli/single-file > /dev/null 2>&1; echo "cache exit=$?"
          cat > cap.sh <<'EOF'
          cap() {
              name=$1; shift
              echo "===== $name"
              rm -f out.html log.txt
              start=$(date +%s.%N)
              timeout 150 deno run -A cli/single-file https://example.com out.html "$@" > log.txt 2>&1
              code=$?
              secs=$(echo "$(date +%s.%N) - $start" | bc)
              size=$(stat -c %s out.html 2>/dev/null || echo none)
              echo "EXIT=$code secs=$secs size=$size"
              tail -12 log.txt
              pkill -f org.mozilla.firefox 2>/dev/null
              sleep 2
          }
          EOF
      - name: Install Flatpak Firefox
        timeout-minutes: 15
        run: |
          set +e
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q flatpak > /dev/null; echo "apt exit=$?"
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo; echo "remote exit=$?"
          sudo flatpak install -y --noninteractive flathub org.mozilla.firefox > /dev/null 2>&1; echo "install exit=$?"
          flatpak info org.mozilla.firefox | head -8
          flatpak info --show-permissions org.mozilla.firefox
          cat /var/lib/flatpak/exports/bin/org.mozilla.firefox
          which firefox; firefox --version
      - name: F - Flatpak Firefox
        run: |
          set +e
          . ./cap.sh
          FF=/var/lib/flatpak/exports/bin/org.mozilla.firefox
          cap "control: system firefox" --browser-engine firefox
          cap "flatpak explicit" --browser-engine firefox --browser-executable-path $FF
          echo "---- direct launch, CLI-like args, 25 s"
          mkdir -p /tmp/fp1 && echo 'user_pref("remote.active-protocols", 1);' > /tmp/fp1/user.js
          timeout 25 $FF --remote-debugging-port=9333 --profile /tmp/fp1 --no-remote --new-instance --headless > direct.txt 2>&1; echo "direct exit=$?"
          tail -25 direct.txt
          echo "host /tmp/fp1:"; ls -la /tmp/fp1 | head -20
          echo "sandbox view of /tmp:"; flatpak run --command=ls org.mozilla.firefox -la /tmp 2>&1 | head -10
          echo "---- override --filesystem=/tmp"
          sudo flatpak override --filesystem=/tmp org.mozilla.firefox
          cap "flatpak explicit, /tmp shared" --browser-engine firefox --browser-executable-path $FF
          sudo flatpak override --reset org.mozilla.firefox
          echo "---- TMPDIR under HOME, home shared"
          mkdir -p $HOME/sftmp
          sudo flatpak override --filesystem=home org.mozilla.firefox
          TMPDIR=$HOME/sftmp cap "flatpak explicit, TMPDIR=~/sftmp, home shared" --browser-engine firefox --browser-executable-path $FF
          sudo flatpak override --reset org.mozilla.firefox
          echo "---- TMPDIR under HOME, no override (negative)"
          TMPDIR=$HOME/sftmp cap "flatpak explicit, TMPDIR=~/sftmp, no override" --browser-engine firefox --browser-executable-path $FF
          exit 0
